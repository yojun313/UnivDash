[project]
name = "univdash"
version = "0.2.0"
description = "Mobile-first web dashboard for tmux sessions running Claude Code / Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rich>=14.1.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.15.0",
]
