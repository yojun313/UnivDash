<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>화면 보기</title>
<link rel="stylesheet" href="{{ asset('view.css') }}">
<script src="{{ asset('vendor/marked.min.js') }}" defer></script>
<script src="{{ asset('vendor/purify.min.js') }}" defer></script>
<script src="{{ asset('view.js') }}" defer></script>
</head>
<body>
<header class="vw-head">
  <span class="vw-dot" id="vwDot" aria-hidden="true"></span>
  <h1 id="vwTitle">화면 보기</h1>
  <span class="vw-badge" title="이 화면은 보기만 할 수 있어요. 입력은 보낼 수 없어요.">읽기 전용</span>
  <span class="vw-meta" id="vwMeta"></span>
  <span class="vw-tabs hidden" id="vwTabs" role="tablist">
    <button type="button" id="vwTabChat" role="tab" aria-selected="true">채팅</button>
    <button type="button" id="vwTabTerm" role="tab" aria-selected="false">터미널</button>
  </span>
  <span class="vw-tools">
    <button type="button" id="vwFit" aria-pressed="true" title="화면 너비에 맞추기">맞춤</button>
    <button type="button" id="vwPause" aria-pressed="false" title="잠시 멈추기">멈춤</button>
    <button type="button" id="vwForget" class="hidden" title="이 브라우저에 기억해 둔 접근 코드를 지워요 (같이 쓰는 컴퓨터라면 눌러 주세요)">코드 지우기</button>
  </span>
</header>
<main class="vw-main" id="vwMain">
  <form class="vw-code hidden" id="vwCode" autocomplete="off">
    <div class="vw-code-icon" aria-hidden="true">🔒</div>
    <h2>접근 코드를 넣어 주세요</h2>
    <p>공유한 사람에게 따로 받은 코드예요. 코드가 있어야 화면을 볼 수 있어요.</p>
    <input id="vwCodeInput" name="code" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" spellcheck="false" maxlength="20" placeholder="XXXX-XXXX-XXXX" aria-label="접근 코드" required>
    <button type="submit" id="vwCodeBtn">보기</button>
    <p class="vw-code-hint">한 번 넣으면 이 브라우저에 기억해서, 공유가 끝날 때까지 다시 묻지 않아요.</p>
    <p class="vw-code-err" id="vwCodeErr" role="alert"></p>
  </form>
  <div class="vw-chat hidden" id="vwChat">
    <button type="button" class="vw-older hidden" id="vwOlder">이전 대화 더 보기</button>
    <div class="vw-list" id="vwList"></div>
  </div>
  <pre class="vw-term" id="vwTerm" aria-live="off"></pre>
  <div class="vw-note" id="vwNote">불러오는 중…</div>
</main>
<button type="button" class="vw-latest hidden" id="vwLatest">최신 ↓</button>
</body>
</html>
