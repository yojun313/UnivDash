{% extends '_layout.html' %}

{% block head_extra %}
    <script src="/static/vendor/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
        <div class="flex-1 overflow-y-auto p-4 md:p-6 safe-bottom">
        <div class="max-w-7xl mx-auto">
            <section id="ai-usage" class="mb-8 scroll-mt-6 space-y-5">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="text-lg font-bold text-white">AI Usage</h2>
                            <span class="rounded-full border border-white/10 bg-white/5 px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider text-white/50">Local logs</span>
                        </div>
                        <p id="aiUsageCaption" class="mt-1 text-xs text-white/40">연결 상태를 확인하고 있습니다.</p>
                    </div>
                    <div class="flex items-center gap-2 self-start sm:self-auto">
                        <div class="glass-soft flex rounded-xl p-1 text-[11px] font-bold" role="group" aria-label="집계 기간">
                            <button type="button" data-ai-days="1" class="rounded-lg px-3 py-1.5 text-white/50 transition">오늘</button>
                            <button type="button" data-ai-days="7" class="rounded-lg px-3 py-1.5 text-white/50 transition">7일</button>
                            <button type="button" data-ai-days="30" class="rounded-lg px-3 py-1.5 text-white/50 transition">30일</button>
                        </div>
                        <button id="aiUsageRefresh" type="button" class="glass-soft rounded-xl px-3 py-2 text-xs font-bold text-white/60 hover:bg-white/10 hover:text-white transition" aria-label="사용량 새로고침"><i class="fas fa-rotate"></i></button>
                    </div>
                </div>

                <div>
                    <p class="mb-2 text-[10px] font-bold uppercase tracking-wider text-white/40"><i class="fas fa-gauge-high mr-1.5 text-blue-400"></i>남은 사용량</p>
                    <div id="aiLimits" class="grid grid-cols-1 gap-4 lg:grid-cols-2">
                        <div class="glass rounded-2xl p-5 text-xs text-white/35">불러오는 중...</div>
                        <div class="glass rounded-2xl p-5 text-xs text-white/35">불러오는 중...</div>
                    </div>
                </div>

                <div id="aiKpis" class="grid grid-cols-2 gap-4 lg:grid-cols-4"></div>

                <div class="grid grid-cols-1 gap-4 xl:grid-cols-5">
                    <div class="glass rounded-2xl p-5 shadow-xl xl:col-span-3">
                        <div class="mb-4 flex items-center justify-between">
                            <p class="text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-chart-column mr-1.5 text-blue-400"></i>일별 토큰 사용량</p>
                            <div class="flex items-center gap-3 text-[10px] font-bold text-white/50">
                                <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-[#d97757]"></span>Claude</span>
                                <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-[#10a37f]"></span>Codex</span>
                            </div>
                        </div>
                        <div class="h-64 w-full"><canvas id="aiUsageChart"></canvas></div>
                    </div>
                    <div class="glass rounded-2xl p-5 shadow-xl xl:col-span-2">
                        <p class="mb-3 text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-table-list mr-1.5 text-purple-400"></i>상세 비교</p>
                        <div id="aiCompare" class="max-h-72 overflow-y-auto"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
                    <div class="glass rounded-2xl p-5 shadow-xl">
                        <p class="mb-3 text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-clock mr-1.5 text-amber-400"></i>시간대별 사용량</p>
                        <div class="h-52 w-full"><canvas id="aiHourlyChart"></canvas></div>
                    </div>
                    <div class="glass rounded-2xl p-5 shadow-xl">
                        <p class="mb-3 text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-calendar-week mr-1.5 text-cyan-400"></i>요일별 사용량</p>
                        <div class="h-52 w-full"><canvas id="aiWeekdayChart"></canvas></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 xl:grid-cols-3">
                    <div class="glass rounded-2xl p-5 shadow-xl">
                        <p class="mb-4 text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-layer-group mr-1.5 text-emerald-400"></i>토큰 구성</p>
                        <div id="aiComposition" class="space-y-5"></div>
                    </div>
                    <div class="glass rounded-2xl p-5 shadow-xl">
                        <p class="mb-2 text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-microchip mr-1.5 text-blue-400"></i>모델별 사용량</p>
                        <div id="aiModels" class="divide-y divide-white/5"></div>
                    </div>
                    <div class="glass rounded-2xl p-5 shadow-xl">
                        <p class="mb-2 text-xs font-bold uppercase tracking-wider text-white/50"><i class="fas fa-folder-open mr-1.5 text-orange-400"></i>프로젝트별 사용량</p>
                        <div id="aiProjects" class="divide-y divide-white/5"></div>
                    </div>
                </div>
            </section>
        </div>
        </div>
{% endblock %}

{% block scripts %}
    <script src="/static/ai-usage.js"></script>
{% endblock %}
