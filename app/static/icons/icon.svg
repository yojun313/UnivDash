<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 밝은 오로라: 흰 바탕 위에 민트 · 하늘 · 라벤더 · 복숭아 빛이 번진다 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f1ff"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.12" cy="0.10" r="0.62">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.92" cy="0.18" r="0.60">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0.85" cy="0.92" r="0.65">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a4" cx="0.10" cy="0.90" r="0.55">
      <stop offset="0" stop-color="#fbcfe8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbcfe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.45" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 꽉 찬 정사각형: iOS 가 모서리를 직접 둥글게 자른다 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#a1)"/>
  <rect width="1024" height="1024" fill="url(#a2)"/>
  <rect width="1024" height="1024" fill="url(#a3)"/>
  <rect width="1024" height="1024" fill="url(#a4)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- 터미널 창 -->
  <rect x="212" y="262" width="600" height="500" rx="72" fill="#05070d" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
  <circle cx="290" cy="330" r="17" fill="#f87171"/>
  <circle cx="345" cy="330" r="17" fill="#fbbf24"/>
  <circle cx="400" cy="330" r="17" fill="#34d399"/>
  <path d="M322 470 L432 555 L322 640" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M492 640 H672" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
</svg>
